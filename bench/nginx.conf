# nginx config for the netRector benchmark (same worker count as --threads)
worker_processes WORKERS;
worker_rlimit_nofile 1048576;
pid /tmp/nginx-bench.pid;
error_log /tmp/nginx-bench-error.log warn;
events { worker_connections 200000; multi_accept off; use epoll; }
http {
    access_log off;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300;
    keepalive_requests 10000000;
    server {
        listen 8081 reuseport backlog=4096;
        listen 8444 ssl reuseport backlog=4096;
        ssl_certificate CERT;
        ssl_certificate_key KEY;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets on;
        root /tmp/bench-www;
        location / { return 200 "Hello from nginx\n"; }
        location /file { alias /tmp/bench-www/file.bin; }
    }
}
